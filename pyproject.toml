[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scambio"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["ruff", "mypy", "pytest", "python-dbusmock", "pygobject-stubs==2.10.0"]

[project.scripts]
scambio = "scambio.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scambio = ["core/dbus/*.xml"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["scambio.core.*", "scambio.config", "scambio.state", "scambio.i18n", "scambio.ui.presentation", "scambio.ui.settings_model"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
